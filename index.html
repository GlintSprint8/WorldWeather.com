<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Weather – weather in any city</title>
<meta name="description" content="Search any city in the world and see the weather now and for the next 5 days.">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff1ff;--ink:#12324a;--card:#fff;--accent:#1f7ae0;--soft:#bfe0fa;--line:#12324a}
@media (prefers-color-scheme:dark){:root{--bg:#0d1b2a;--ink:#eaf4ff;--card:#17293d;--accent:#5aa9ff;--soft:#22405d;--line:#eaf4ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-size:1.125rem;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(2rem,8vw,3rem);margin:6px 0 4px;line-height:1.05;text-align:center}
.sub{text-align:center;margin:0 0 18px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:14px 16px;border:3px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink)}
button{font:inherit;color:var(--ink);cursor:pointer}
.go{padding:0 22px;font-weight:700;background:var(--accent);color:#fff;border:3px solid var(--line);border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chips button{padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--soft)}
.now{background:var(--card);border:4px solid var(--line);border-radius:28px;padding:20px;text-align:center;box-shadow:0 8px 0 var(--line)}
.place{font-size:1.4rem;font-weight:700}
.icon{font-size:5rem;line-height:1.1}
.temp{font-size:clamp(3rem,14vw,4.5rem);font-weight:700;line-height:1}
.desc{font-size:1.3rem;margin:4px 0 12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:var(--soft);border-radius:16px;padding:8px 4px}
.facts b{display:block;font-size:1.2rem}
.units{margin-top:14px;display:inline-flex;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.units button{padding:6px 16px;border:0;background:transparent;font-weight:600}
.units button[aria-pressed=true]{background:var(--accent);color:#fff}
h2{margin:28px 0 10px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.day{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px 6px;text-align:center}
.day .i{font-size:2.2rem}
.msg{text-align:center;min-height:1.6em;margin-top:12px}
footer{margin-top:32px;text-align:center;font-size:.85rem;opacity:.85}
footer a{color:inherit}
:focus-visible{outline:4px solid #f5a623;outline-offset:3px}
</style>
</head>
<body>
<main class="wrap">
  <h1>🌍 World Weather</h1>
  <p class="sub">Type a city to see its weather. </p>

  <form id="f">
    <input id="q" type="search" placeholder="Try Tokyo, Lagos, Paris…" aria-label="City name" autocomplete="off">
    <button class="go" type="submit">Search</button>
  </form>
  <div class="chips" id="chips" aria-label="Quick cities"></div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <section id="out" hidden>
    <div class="now">
      <div class="place" id="place"></div>
      <div class="icon" id="icon" aria-hidden="true"></div>
      <div class="temp" id="temp"></div>
      <div class="desc" id="desc"></div>
      <div class="facts">
        <div><b id="feels"></b>Feels like</div>
        <div><b id="wind"></b>Wind</div>
        <div><b id="hum"></b>Humidity</div>
      </div>
      <div class="units" role="group" aria-label="Units">
        <button type="button" id="uc" aria-pressed="true">°C</button>
        <button type="button" id="uf" aria-pressed="false">°F</button>
      </div>
    </div>
    <h2>Next 5 days</h2>
    <div class="days" id="days"></div>
  </section>

  <footer>Free. No sign-up. Weather data by <a href="https://open-meteo.com/" rel="noopener">Open-Meteo.com</a>.</footer>
</main>

<script>
const $=id=>document.getElementById(id);
const CITIES=["London","New York","Tokyo","Lagos","Sydney","Mumbai","São Paulo","Cairo"];
// weather code -> [emoji, words]
const W={0:["☀️","Clear sky"],1:["🌤️","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Cloudy"],45:["🌫️","Foggy"],48:["🌫️","Foggy"],
51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],56:["🌧️","Freezing drizzle"],57:["🌧️","Freezing drizzle"],
61:["🌧️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],
71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],77:["❄️","Snow grains"],
80:["🌦️","Rain showers"],81:["🌧️","Rain showers"],82:["⛈️","Strong showers"],85:["🌨️","Snow showers"],86:["🌨️","Snow showers"],
95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm with hail"],99:["⛈️","Thunderstorm with hail"]};
const wx=c=>W[c]||["🌡️","Unknown"];
let data=null,unitF=false;

const T=c=>Math.round(unitF?c*9/5+32:c)+"°";
const S=k=>unitF?Math.round(k*0.621)+" mph":Math.round(k)+" km/h";

function render(){
  if(!data)return;
  const {place,cur,daily}=data,[e,d]=wx(cur.weather_code);
  $("place").textContent=place;
  $("icon").textContent=e;
  $("temp").textContent=T(cur.temperature_2m);
  $("desc").textContent=d;
  $("feels").textContent=T(cur.apparent_temperature);
  $("wind").textContent=S(cur.wind_speed_10m);
  $("hum").textContent=Math.round(cur.relative_humidity_2m)+"%";
  $("uc").setAttribute("aria-pressed",!unitF);$("uf").setAttribute("aria-pressed",unitF);
  $("days").innerHTML="";
  daily.time.slice(1,6).forEach((t,i)=>{
    const n=i+1,[ic,tx]=wx(daily.weather_code[n]);
    const name=new Date(t+"T12:00:00").toLocaleDateString(undefined,{weekday:"short"});
    const el=document.createElement("div");el.className="day";
    el.innerHTML=`<b>${name}</b><div class="i" aria-hidden="true">${ic}</div><div>${tx}</div><div><b>${T(daily.temperature_2m_max[n])}</b> / ${T(daily.temperature_2m_min[n])}</div>`;
    $("days").appendChild(el);
  });
  $("out").hidden=false;
}

async function search(name){
  name=name.trim();if(!name)return;
  $("msg").textContent="Looking…";
  try{
    const g=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en`)).json();
    if(!g.results||!g.results.length){$("msg").textContent=`We could not find “${name}”. Check the spelling and try again.`;return}
    const p=g.results[0];
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}`+
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m`+
      `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
    const w=await (await fetch(url)).json();
    data={place:[p.name,p.admin1,p.country].filter(Boolean).join(", "),cur:w.current,daily:w.daily};
    $("msg").textContent="";render();
  }catch(e){
    $("msg").textContent="Oops! Could not load the weather. Check your internet and try again.";
  }
}
$("f").onsubmit=e=>{e.preventDefault();search($("q").value)};
$("uc").onclick=()=>{unitF=false;render()};
$("uf").onclick=()=>{unitF=true;render()};
CITIES.forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=c;b.onclick=()=>{$("q").value=c;search(c)};$("chips").appendChild(b)});
search("London");
</script>
</body>
</html>
